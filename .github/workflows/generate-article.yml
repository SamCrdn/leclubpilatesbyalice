name: Générer un article de blog

on:
  schedule:
    - cron: '0 5 * * 1,3,5'  # Lun/Mer/Ven à 7h (heure de Paris, UTC+2)
  workflow_dispatch:            # Permet aussi de lancer manuellement depuis GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Générer l'article
        run: npx tsx scripts/generate-article.ts
        env:
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          SANITY_API_TOKEN:             ${{ secrets.SANITY_API_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET:   production
